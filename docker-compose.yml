version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roguebyte_erp_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://roguebyte_user:secure_password_2026@postgres:5432/roguebyte_erp?schema=public
      - DEFAULT_CURRENCY=OMR
      - DEFAULT_DECIMAL_PLACES=3
      - TIMEZONE=Asia/Muscat
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: roguebyte_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: roguebyte_user
      POSTGRES_PASSWORD: secure_password_2026
      POSTGRES_DB: roguebyte_erp
    ports:
      - "5432:5432"
    volumes:
      - roguebyte_pgdata:/var/lib/postgresql/data

volumes:
  roguebyte_pgdata:
    driver: local
